# Liste des médias de Pixo V1 : ce qu'il faut trouver ou créer.
# Le validateur vérifiera que chaque image, chanson et vidéo citée dans une
# séance existe ici (tâche 3.3). « file » reste vide tant que le média n'est pas trouvé.
# status : todo | found | done.   license : à noter pour chaque source.
# Format conseillé pour les images : PNG ou SVG carré (512 x 512), fond clair,
# un seul style pour les 23 mots, nom de fichier = identifiant (word_hello.png).

images:
  - { id: word_hello, unit: u1, file: "media/images/word_hello.svg", source: "drawn for Pixo", license: "own work", status: found }
  - { id: word_bye, unit: u1, file: "media/images/word_bye.svg", source: "drawn for Pixo", license: "own work", status: found }
  - { id: word_yes, unit: u1, file: "media/images/word_yes.svg", source: "drawn for Pixo", license: "own work", status: found }
  - { id: word_no, unit: u1, file: "media/images/word_no.svg", source: "drawn for Pixo", license: "own work", status: found }
  - { id: word_one, unit: u1, file: "", source: "", license: "", status: todo }
  - { id: word_two, unit: u1, file: "", source: "", license: "", status: todo }
  - { id: word_three, unit: u1, file: "", source: "", license: "", status: todo }
  - { id: word_four, unit: u1, file: "", source: "", license: "", status: todo }
  - { id: word_five, unit: u1, file: "", source: "", license: "", status: todo }
  - { id: word_red, unit: u2, file: "", source: "", license: "", status: todo }
  - { id: word_blue, unit: u2, file: "", source: "", license: "", status: todo }
  - { id: word_yellow, unit: u2, file: "", source: "", license: "", status: todo }
  - { id: word_green, unit: u2, file: "", source: "", license: "", status: todo }
  - { id: word_pink, unit: u2, file: "", source: "", license: "", status: todo }
  - { id: word_black, unit: u2, file: "", source: "", license: "", status: todo }
  - { id: word_white, unit: u2, file: "", source: "", license: "", status: todo }
  - { id: word_head, unit: u3, file: "", source: "", license: "", status: todo }
  - { id: word_eyes, unit: u3, file: "", source: "", license: "", status: todo }
  - { id: word_nose, unit: u3, file: "", source: "", license: "", status: todo }
  - { id: word_mouth, unit: u3, file: "", source: "", license: "", status: todo }
  - { id: word_ears, unit: u3, file: "", source: "", license: "", status: todo }
