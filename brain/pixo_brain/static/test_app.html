<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixo test app</title>
<style>
  :root { --bg: #f6f5f2; --card: #fff; --ink: #1f2328; --muted: #6b7280; --accent: #5b5bd6; --glow: #f5b800; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  main { max-width: 760px; margin: 0 auto; padding: 16px; display: grid; gap: 12px; }
  h1 { font-size: 20px; margin: 0; }
  .bar, .panel { background: var(--card); border-radius: 12px; padding: 12px; box-shadow: 0 1px 2px #0001; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  input, select, button { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid #d0d4da; }
  button { background: var(--accent); color: #fff; border: none; cursor: pointer; }
  button.secondary { background: #e7e8ec; color: var(--ink); }
  button:disabled { opacity: .4; cursor: default; }
  #pixo { display: flex; gap: 12px; align-items: center; min-height: 72px; }
  #face { font-size: 44px; transition: transform .2s; }
  #face.happy { transform: scale(1.2); } #face.dance { animation: dance .6s 2; } #face.show { transform: rotate(-12deg); }
  @keyframes dance { 0%,100% { transform: rotate(0) } 25% { transform: rotate(-20deg) } 75% { transform: rotate(20deg) } }
  #bubble { font-size: 22px; font-weight: 600; }
  #cards { display: flex; gap: 12px; flex-wrap: wrap; min-height: 96px; }
  .card { min-width: 120px; padding: 24px 16px; text-align: center; font-size: 20px; border-radius: 12px; background: #eef0ff; border: 3px solid transparent; }
  .card.glow { border-color: var(--glow); box-shadow: 0 0 16px var(--glow); }
  button.card { color: var(--ink); }
  #answer { display: none; gap: 8px; flex-wrap: wrap; align-items: center; }
  #answer.on { display: flex; }
  #log { font: 12px/1.5 ui-monospace, monospace; height: 220px; overflow: auto; white-space: pre-wrap; color: var(--muted); }
  .out { color: #0b7a3e; } .in { color: #1f4fd6; } .err { color: #c0362c; }
  .muted { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Pixo test app <span class="muted">(a fake Android app, for testing the brain)</span></h1>

  <div class="bar">
    <button id="connect">Connect</button>
    <select id="session" disabled></select>
    <input id="nickname" value="Sara" size="10" aria-label="nickname">
    <button id="start" disabled>Start session</button>
    <button id="stop" class="secondary" disabled>Stop</button>
    <label class="muted"><input type="checkbox" id="speak" checked> speak aloud</label>
  </div>

  <div class="panel">
    <div id="pixo"><div id="face">🤖</div><div id="bubble">Not connected</div></div>
  </div>

  <div class="panel"><div id="cards"></div></div>

  <div class="panel" id="answer"></div>

  <div class="panel"><div id="log"></div></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let ws = null, words = {}, active = false;

function log(cls, text) {
  const line = document.createElement("div");
  line.className = cls; line.textContent = text;
  $("log").appendChild(line); $("log").scrollTop = 1e9;
}
function send(msg) { ws.send(JSON.stringify(msg)); log("out", "app → " + JSON.stringify(msg)); }
function label(id) { return (words[id] && words[id].text) || id; }

function speak(text) {
  return new Promise((resolve) => {
    if (!$("speak").checked || !("speechSynthesis" in window)) return setTimeout(resolve, 500);
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = 0.85; u.pitch = 1.3;
    u.onend = u.onerror = () => resolve();
    speechSynthesis.speak(u);
  });
}

function showCards(ids, highlight) {
  $("cards").innerHTML = "";
  for (const id of ids) {
    const div = document.createElement("div");
    div.className = "card" + (id === highlight ? " glow" : "");
    div.textContent = label(id);
    $("cards").appendChild(div);
  }
}

function askAnswer(build) { $("answer").innerHTML = ""; build($("answer")); $("answer").classList.add("on"); }
function closeAnswer() { $("answer").classList.remove("on"); $("answer").innerHTML = ""; }

function listenUI(cmd) {
  askAnswer((box) => {
    box.innerHTML = '<span class="muted">The child says:</span>';
    const input = document.createElement("input"); input.placeholder = "type it…";
    const ok = document.createElement("button"); ok.textContent = "Send";
    const silent = document.createElement("button"); silent.className = "secondary"; silent.textContent = "Silence";
    const reply = (t) => { closeAnswer(); send({ type: "heard", id: cmd.id, transcripts: t }); };
    ok.onclick = () => reply(input.value.trim() ? [input.value.trim()] : []);
    input.onkeydown = (e) => { if (e.key === "Enter") ok.onclick(); };
    silent.onclick = () => reply([]);
    box.append(input, ok, silent);
    const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (Rec) {
      const mic = document.createElement("button"); mic.textContent = "🎤 Use mic";
      mic.onclick = () => {
        const rec = new Rec(); rec.lang = "en-US"; rec.maxAlternatives = 5;
        rec.onresult = (e) => reply(Array.from(e.results[0]).map((a) => a.transcript));
        rec.onerror = () => reply([]);
        rec.start(); mic.textContent = "listening…"; mic.disabled = true;
      };
      box.append(mic);
    }
    input.focus();
  });
}

function tapUI(cmd) {
  $("cards").innerHTML = "";
  for (const id of cmd.choices) {
    const b = document.createElement("button");
    b.className = "card"; b.textContent = label(id);
    b.onclick = () => {
      document.querySelectorAll("button.card").forEach((x) => (x.disabled = true));
      closeAnswer(); send({ type: "tapped", id: cmd.id, word: id });
    };
    $("cards").appendChild(b);
  }
  askAnswer((box) => {
    box.innerHTML = '<span class="muted">Touch an image above, or:</span>';
    const none = document.createElement("button"); none.className = "secondary"; none.textContent = "Nothing touched";
    none.onclick = () => { closeAnswer(); send({ type: "tapped", id: cmd.id, word: null }); };
    box.append(none);
  });
}

async function onCommand(cmd) {
  switch (cmd.type) {
    case "say":
      $("bubble").textContent = cmd.text; await speak(cmd.text);
      return active && send({ type: "done", id: cmd.id });
    case "show": showCards(cmd.words, cmd.highlight); return send({ type: "done", id: cmd.id });
    case "clear": $("cards").innerHTML = ""; return send({ type: "done", id: cmd.id });
    case "animate":
      $("face").className = cmd.name; setTimeout(() => ($("face").className = ""), 1200);
      return send({ type: "done", id: cmd.id });
    case "listen": $("bubble").textContent += "  👂"; return listenUI(cmd);
    case "wait_tap": return tapUI(cmd);
  }
}

function onMessage(event) {
  const msg = JSON.parse(event.data);
  log(msg.type === "error" ? "err" : "in", "brain → " + event.data);
  if (msg.type === "welcome") {
    $("session").innerHTML = msg.sessions.map((s) => `<option value="${s.id}">${s.id} – ${s.title}</option>`).join("");
    $("session").disabled = false; $("start").disabled = false; $("bubble").textContent = "Connected. Pick a session.";
  } else if (msg.type === "session_started") {
    words = msg.words; active = true; $("start").disabled = true; $("stop").disabled = false;
  } else if (msg.type === "session_ended") {
    active = false; closeAnswer(); $("cards").innerHTML = ""; $("start").disabled = false; $("stop").disabled = true;
    $("bubble").textContent = `Session ended: ${msg.successes}/${msg.asks} right${msg.stopped ? " (stopped)" : ""}`;
  } else if ("id" in msg) {
    onCommand(msg);
  }
}

$("connect").onclick = () => {
  const url = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws";
  ws = new WebSocket(url);
  ws.onopen = () => send({ type: "hello", protocol: "0.1", app: "test-page" });
  ws.onmessage = onMessage;
  ws.onclose = () => {
    $("bubble").textContent = "Disconnected"; $("start").disabled = true; $("stop").disabled = true;
    $("session").disabled = true; log("err", "connection closed");
  };
  $("connect").disabled = true;
};
$("start").onclick = () => send({ type: "start_session", session: $("session").value, nickname: $("nickname").value });
$("stop").onclick = () => { active = false; closeAnswer(); speechSynthesis.cancel(); send({ type: "stop_session" }); };
</script>
</body>
</html>
