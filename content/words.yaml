# Pixo V1 : les 23 mots de référence.
# accepted = ce que la reconnaissance vocale peut renvoyer quand l'enfant dit
# correctement le mot (prononciations approximatives, singulier/pluriel).
# Règle : une variante ne correspond jamais à un autre mot de la liste.
# "yes" et "no" sont entre guillemets : sans cela, YAML les lit comme vrai/faux.

# --- Unité 1 « Hello! » ---
- id: hello
  text: hello
  unit: u1
  image: word_hello
  accepted: [hello, hallo, hullo, allo, ello]
- id: bye
  text: bye
  unit: u1
  image: word_bye
  accepted: [bye, bye-bye, by, buy, bai]
- id: "yes"
  text: "yes"
  unit: u1
  image: word_yes
  accepted: ["yes", yeah, yas, yez, yess]
- id: "no"
  text: "no"
  unit: u1
  image: word_no
  accepted: ["no", know, noh, nope]
- id: one
  text: one
  unit: u1
  image: word_one
  accepted: [one, won, wan, wun]
- id: two
  text: two
  unit: u1
  image: word_two
  accepted: [two, to, too, tu]
- id: three
  text: three
  unit: u1
  image: word_three
  accepted: [three, tree, free, sree, tri]
- id: four
  text: four
  unit: u1
  image: word_four
  accepted: [four, for, fore, foor]
- id: five
  text: five
  unit: u1
  image: word_five
  accepted: [five, fife, fiv, faiv]

