[project]
name = "pixo-brain"
version = "0.1.0"
description = "Pixo's brain: loads the pedagogical content and runs the sessions"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "jsonschema>=4.23,<5",
    "livekit-api>=1.0,<2",
    "pydantic>=2.9,<3",
    "pyyaml>=6.0,<7",
    "uvicorn[standard]>=0.32,<1",
]

[project.scripts]
pixo-validate = "pixo_brain.validate:main"
pixo-play = "pixo_brain.play:main"
pixo-serve = "pixo_brain.server:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
