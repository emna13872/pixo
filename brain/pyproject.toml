[project]
name = "pixo-brain"
version = "0.1.0"
description = "Pixo's brain: loads the pedagogical content and runs the sessions"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9,<3",
    "pyyaml>=6.0,<7",
]

[project.scripts]
pixo-validate = "pixo_brain.validate:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
